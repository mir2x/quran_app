name: quran_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  shared_preferences: ^2.3.5
  google_fonts: ^6.3.0
  flutter_riverpod: ^2.3.10
  scrollable_positioned_list: ^0.3.8
  dio: ^5.3.2
  path_provider: ^2.1.5
  archive: ^4.0.7
  share_plus: ^10.1.4
  flutter_screenutil: ^5.9.3
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.4+4
  sqflite: ^2.4.1
  wakelock_plus: ^1.2.10
  hugeicons: ^0.0.8
  scroll_to_index: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  device_preview: ^1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/image/
    - assets/image/front_page/
  fonts:
    - family: SolaimanLipi
      fonts:
        - asset: fonts/Bangla Fonts/Solaimanlipi.ttf
    - family: Kalpurush
      fonts:
        - asset: fonts/Bangla Fonts/Kalpurush.ttf
    - family: Noto Sans Bengali
      fonts:
        - asset: fonts/Bangla Fonts/Noto Sans Bengali.ttf
    - family: Siyam Rupali
      fonts:
        - asset: fonts/Bangla Fonts/Siyam Rupali.ttf

    - family: Al Mushaf Quran
      fonts:
        - asset: fonts/Arabic Fonts/Al Mushaf Quran.ttf
    - family: Al Qalam Kolkatta Quranic
      fonts:
        - asset: fonts/Arabic Fonts/Al Qalam Kolkatta Quranic.ttf
    - family: Al Qalam Quran
      fonts:
        - asset: fonts/Arabic Fonts/Al Qalam Quran.ttf
    - family: Al Qalam Quran Majeed
      fonts:
        - asset: fonts/Arabic Fonts/Al Qalam Quran Majeed.ttf